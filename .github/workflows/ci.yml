name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]          # ← запускает workflow при пуше тега v1.0.0 и т.п.
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: Тесты (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Кэш pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Запуск тестов с Allure
        run: python -m pytest -v --alluredir=allure-results

      - name: Сохранить сырые результаты Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: allure-results/
          retention-days: 7
          if-no-files-found: ignore

  allure-report:
    name: Allure-отчёт
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Скачать все allure-results
        uses: actions/download-artifact@v5
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Установка Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -sSL https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz \
            -o /tmp/allure.tgz
          sudo tar -xzf /tmp/allure.tgz -C /opt
          sudo ln -sf /opt/allure-2.32.0/bin/allure /usr/local/bin/allure
          allure --version

      - name: Генерация HTML-отчёта
        run: allure generate allure-results --clean -o allure-report

      - name: Загрузка HTML-отчёта как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: error

      - name: Публикация на GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true
          commit_message: 'Allure report: ${{ github.sha }}'

  build-windows:
    name: Сборка Windows .exe
    needs: test
    if: success()
    runs-on: windows-latest
    permissions:
      contents: write        # ← нужно, чтобы softprops/action-gh-release мог создать релиз

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Сборка onefile GUI-бинарника
        run: pyinstaller --onefile --windowed --name ok-helper main.py

      - name: Проверка, что бинарник существует
        shell: bash
        run: |
          ls -la dist/
          test -f "dist/ok-helper.exe"

      # Формируем портативный ZIP: exe + README с инструкцией по
      # разблокировке. Именно этот файл пользователь скачивает —
      # Chrome/Edge ZIP не блокируют.
      - name: Подготовка портативного пакета
        shell: bash
        run: |
          mkdir -p portable
          cp dist/ok-helper.exe portable/
          cat > portable/README.txt <<'EOF'
          ok-helper — портативная сборка для Windows
          =========================================

          Как запустить
          -------------
          1. Распакуйте архив в любую папку (например, C:\Tools\ok-helper).
          2. При первом запуске Windows может показать окно
             «Windows защитила ваш компьютер» (SmartScreen) — это
             стандартная защита для неподписанных .exe. Нажмите:
                 Подробнее → Выполнить в любом случае.
          3. Приложение запустится. Конфиг создастся автоматически в
             %APPDATA%\ok-helper\config.toml.

          Альтернативный способ разблокировки (если SmartScreen не
          показывает кнопку «Выполнить в любом случае»)
          ------------------------------------------------------
          • Правый клик по ok-helper.exe → Свойства.
          • Внизу вкладки «Общие» поставьте галочку «Разблокировать»
            (Unblock) → ОК.
          • Запустите файл обычным двойным кликом.

          Или одной командой в PowerShell (в папке с exe):
              Unblock-File .\ok-helper.exe

          Требования
          ----------
          • Windows 10 или новее (x64).
          • Python устанавливать не нужно — всё в одном .exe.
          EOF

      - name: Упаковка портативного ZIP
        shell: bash
        run: |
          cd portable
          7z a -tzip ../ok-helper-windows-portable.zip ./*
          cd ..
          ls -la ok-helper-windows-portable.zip

      # ─────────────────────────────────────────────────────────────
      # Основной канал распространения: GitHub Release.
      # Страница релиза публична, не требует авторизации,
      # Chrome/Edge не блокируют скачивание ассетов релиза.
      # Пользователю достаточно открыть:
      #   https://github.com/<owner>/<repo>/releases/latest
      # ─────────────────────────────────────────────────────────────
      - name: Создать GitHub Release и прикрепить ZIP (только по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ok-helper-windows-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────
      # Вспомогательный артефакт — только для мейнтейнера
      # (Chrome блокирует скачивание артефактов напрямую,
      #  обычным пользователям раздавайте через Release).
      # ─────────────────────────────────────────────────────────────
      - name: Сохранить ZIP как артефакт (для внутреннего использования)
        uses: actions/upload-artifact@v4
        with:
          name: ok-helper-windows-portable
          path: ok-helper-windows-portable.zip
          if-no-files-found: error
          retention-days: 30